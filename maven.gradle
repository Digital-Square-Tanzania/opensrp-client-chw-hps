import org.gradle.api.publish.maven.MavenPublication

apply plugin: 'signing'

def getRepositoryPassword() {
    return hasProperty('sonatypePassword') ? sonatypePassword : ""
}

def getRepositoryUsername() {
    return hasProperty('sonatypeUsername') ? sonatypeUsername : ""
}

def isReleaseVersion = {
    return !project.VERSION_NAME.contains("SNAPSHOT")
}

def configurePom = { MavenPublication publication ->
    publication.artifactId = POM_SETTING_ARTIFACT_ID
    publication.pom {
        name = POM_SETTING_NAME
        packaging = POM_SETTING_PACKAGING
        description = POM_SETTING_DESCRIPTION
        url = POM_SETTING_URL

        scm {
            url = POM_SETTING_SCM_URL
            connection = POM_SETTING_SCM_CONNECTION
            developerConnection = POM_SETTING_SCM_DEV_CONNECTION
        }

        licenses {
            license {
                name = POM_SETTING_LICENCE_NAME
                url = POM_SETTING_LICENCE_URL
                distribution = POM_SETTING_LICENCE_DIST
            }
        }

        developers {
            developer {
                id = POM_SETTING_DEVELOPER_ID
                name = POM_SETTING_DEVELOPER_NAME
            }
        }
    }
}

afterEvaluate {
    tasks.register('androidJavadocs', Javadoc) {
        failOnError = false
        source = android.sourceSets.main.java.srcDirs
        classpath += files(android.bootClasspath)
    }

    def androidJavadocsJar = tasks.register('androidJavadocsJar', Jar) {
        dependsOn tasks.named('androidJavadocs')
        archiveClassifier.set('javadoc')
    }

    def androidSourcesJar = tasks.register('androidSourcesJar', Jar) {
        archiveClassifier.set('sources')
        from android.sourceSets.main.java.srcDirs
    }

    plugins.withId('maven-publish') {
        publishing {
            repositories {
                if (project.hasProperty('sonatypeUsername') || project.hasProperty('sonatypePassword')) {
                    maven {
                        name = isReleaseVersion() ? 'SonatypeRelease' : 'SonatypeSnapshot'
                        url = uri(isReleaseVersion()
                                ? 'https://oss.sonatype.org/service/local/staging/deploy/maven2/'
                                : 'https://oss.sonatype.org/content/repositories/snapshots/')
                        credentials {
                            username = getRepositoryUsername()
                            password = getRepositoryPassword()
                        }
                    }
                }
            }

            publications.withType(MavenPublication).configureEach { publication ->
                configurePom(publication)
                artifact androidSourcesJar
                artifact androidJavadocsJar
            }
        }

        signing {
            required {
                isReleaseVersion() && gradle.taskGraph.allTasks.any { task ->
                    task.name.startsWith('publish') && !task.name.endsWith('ToMavenLocal')
                }
            }
            sign publishing.publications
        }
    }

    if (extensions.findByName('nexusStaging') != null) {
        nexusStaging {
            username getRepositoryUsername()
            password getRepositoryPassword()
        }
    }
}
